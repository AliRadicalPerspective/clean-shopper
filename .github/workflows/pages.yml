# Build and publish to GitHub Pages.
#
# Routing is hash-based (#/products), so deep links work on Pages without the
# 404.html redirect trick a History-API app would need.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a branch be published without merging first — useful for previewing
  # a pull request on the real host.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; let a newer one supersede a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /clean-shopper/
          # Publishable, and designed to ship in client code — every table it
          # reaches is behind row-level security. Set these as repository
          # *variables*, not secrets. Absent, the site serves the bundled
          # catalog and says so on screen.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
